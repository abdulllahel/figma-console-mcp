<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>fiGapture Permissions</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #1b2510;
      color: white;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      box-sizing: border-box;
    }
    h2 {
      margin-top: 0;
      font-size: 18px;
    }
    p {
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    button {
      background: #9dba4c;
      color: #121a06;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #c9da8e;
    }
  </style>
</head>
<body>
  <h2>Asset Grabber Permissions</h2>
  <p>fiGapture needs additional permissions to download and intercept assets directly from this webpage.</p>
  <button id="grant-btn">Grant Permissions</button>
  <script src="permissions.js"></script>
</body>
</html>
